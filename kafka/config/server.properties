# ==========================================================
# ✅ Kafka 4.1.0 - Single Node KRaft Configuration (No ZooKeeper)
# ==========================================================

# ---- Core Process Roles ----
process.roles=broker,controller
node.id=1
controller.quorum.voters=1@127.0.0.1:9093

# ---- Listeners ----
listeners=PLAINTEXT://127.0.0.1:9092,CONTROLLER://127.0.0.1:9093
advertised.listeners=PLAINTEXT://127.0.0.1:9092
controller.listener.names=CONTROLLER
inter.broker.listener.name=PLAINTEXT

# ---- Log Directories ----
log.dirs=D:/kafka-logs
metadata.log.dir=C:\\SROAD\\Kafka\\kafka-meta

# ---- Performance ----
num.network.threads=3
num.io.threads=8
socket.send.buffer.bytes=102400
socket.receive.buffer.bytes=102400
socket.request.max.bytes=104857600

# ---- Replication & Transactions ----
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1

# ---- Consumer Group & Topic Settings ----
group.initial.rebalance.delay.ms=0
auto.create.topics.enable=true

# ---- KRaft Metadata Settings ----
# This is required for Kafka 4.x KRaft mode (newer metadata log format)
metadata.log.segment.bytes=104857600
metadata.log.segment.delete.delay.ms=60000

# ---- Misc Stability Options ----
log.retention.hours=168
log.segment.bytes=1073741824
log.retention.check.interval.ms=300000
